
<div id="cornerNudge"
     class="fixed bottom-10 right-4 z-30 w-72 translate-y-4 opacity-0 pointer-events-none
            transition-all duration-500 ease-out lg:bottom-6 lg:right-6">

  <div class="bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">

    <div class="bg-accent px-4 py-3 flex items-center justify-between">
      <p class="text-white text-xs font-bold uppercase tracking-wider">Become an Agent</p>
      <button onclick="dismissCornerNudge()"
              class="w-5 h-5 flex items-center justify-center rounded text-white/70 hover:text-white transition">
        <i class="fas fa-times text-[10px]"></i>
      </button>
    </div>

    <div class="p-4">
      <p class="text-sm font-bold text-gray-900 mb-1">Earn more from your listings</p>
      <p class="text-xs text-gray-500 mb-4 leading-relaxed">
        Verified agents get priority placement, client requests, and free listing tools.
      </p>
      <div class="flex gap-2">
        <a href="{% url 'agent_apply' %}"
           class="flex-1 py-2 bg-primary text-white text-xs font-semibold rounded-lg text-center hover:opacity-90 transition">
          Apply Now
        </a>
        <button onclick="dismissCornerNudge()"
                class="px-3 py-2 border border-gray-200 text-gray-500 text-xs rounded-lg hover:bg-gray-50 transition">
          Later
        </button>
      </div>
    </div>

  </div>
</div>


<script>


  const nudge = document.getElementById('cornerNudge');
  let nudgeDismissed = sessionStorage.getItem('cornerNudgeDismissed') === '1';


  function showNudge() {
    if (nudgeDismissed || !nudge) return;
    nudge.classList.remove('translate-y-4', 'opacity-0', 'pointer-events-none');
    nudge.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
    setTimeout(() => {
      dismissCornerNudge()
    }, 10000)
  }

  function dismissCornerNudge() {
    if (!nudge) return;
    nudge.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
    nudge.classList.add('translate-y-4', 'opacity-0', 'pointer-events-none');
    sessionStorage.setItem('cornerNudgeDismissed', '1');
  };

  setTimeout(() => {
    if (nudgeDismissed == 1) return;
    showNudge();
  }, 10000);

</script>
