
<div id="overlay"
     class="hidden fixed inset-0 z-[1000] bg-black/40"
     style="opacity:0; transition: opacity 250ms ease;"></div>

<div id="advancedModal"
     class="hidden fixed inset-0 z-[1001] flex items-center justify-center p-4">
  <div id="modalBox"
       class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
       style="transform: scale(0.95); transition: transform 250ms ease;">

    <div class="flex items-center justify-between p-6 border-b border-gray-100 sticky top-0 bg-white rounded-t-2xl z-10">
      <div>
        <h3 class="text-base font-semibold text-gray-900">Advanced Filters</h3>
        <p class="text-sm text-gray-500">Narrow down your perfect property</p>
      </div>
      <button onclick="closeAdvancedModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition text-gray-500">
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>

    <form method="GET" action="{% url 'properties' %}" id="advancedForm">

      <div class="p-6 space-y-6">

         <div class="grid lg:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-600 mb-2">Location</label>
                <div class="relative" id="autocomplete-wrapper">
                <i class="fas fa-map-marker-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 z-10 pointer-events-none"></i>
                <input
                    id="advanced_search"
                    name="search"
                    type="text"
                    value="{{ request.GET.search }}"
                    autocomplete="off"
                    placeholder="Maitama, Wuse, Gwarinpa..."
                    class="text-sm w-full pl-11 pr-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none"
                />
                <ul id="autocomplete-list-2"
                    class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg z-[200] overflow-hidden max-h-52 overflow-y-auto">
                </ul>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-600 mb-2">Property Type</label>
                <div class="relative">
                <i class="fas fa-home absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <select id="modal_property_type" name="property_type"

                    {% for type in property_types %}
                    <option value="{{ type.id }}" >{{ type.display_name }}</option>
                    {% endfor %}
                </select>
                <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                </div>
            </div>
            </div>

            </label>
            <label class="flex-1">
              <input type="radio" name="purpose" value="rent" class="peer hidden" {% if request.GET.purpose == "rent" %}checked{% endif %}>

            </label>

                <select name="max_bathrooms" class="w-full pl-8 pr-8 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
                  <option value="">Any</option>

        <div>

<script>
  let overlay = document.getElementById('overlay');
  let advmodal   = document.getElementById('advancedModal');
  const box     = document.getElementById('modalBox');

  function openAdvancedModal() {
    document.getElementById('modal_search').value        = document.getElementById('advanced_search').value;
    document.getElementById('modal_property_type').value = document.getElementById('basic_property_type').value;

    overlay.classList.remove('hidden');
    advmodal.classList.remove('hidden');

    void overlay.offsetHeight;

    overlay.style.opacity = '1';
    box.style.transform   = 'scale(1)';

    document.body.style.overflow = 'hidden';
  }

  function closeAdvancedModal() {
    overlay.style.opacity = '0';
    box.style.transform   = 'scale(0.95)';

    overlay.addEventListener('transitionend', function handler() {
      overlay.classList.add('hidden');
      advmodal.classList.add('hidden');
      overlay.removeEventListener('transitionend', handler);
    });

    document.body.style.overflow = '';
  }

  function clearAdvancedForm() {
    document.getElementById('advancedForm').reset();
  }

  overlay.addEventListener('click', closeAdvancedModal);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAdvancedModal();
  });
</script>

<script>
  let CITIES = [
    {% for city in cities %}
    { code: "{{ city.id }}", label: "{{ city.name }}" },
    {% endfor %}
  ];

  const advSearchInput = document.getElementById('advanced_search');
  const basicSearchInput = document.getElementById('basic_search');
  const dropdown    = document.getElementById('autocomplete-list');
  let activeIndex   = -1;

  function renderSuggestions(matches) {
    dropdown.innerHTML = '';
    activeIndex = -1;

    if (!matches.length) {
      dropdown.classList.add('hidden');
      return;
    }

    matches.forEach(function(city, i) {
      const li = document.createElement('li');
      li.className = 'flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors';
      li.dataset.index = i;
      li.innerHTML =
        '<i class="fas fa-map-marker-alt text-gray-300 text-xs w-3"></i>' +
        '<span>' + city.label + '</span>';

      li.addEventListener('mousedown', function(e) {
        e.preventDefault();
        selectCity(city.label);
      });

      dropdown.appendChild(li);
    });

    dropdown.classList.remove('hidden');
  }

  function selectCity(label) {
    advSearchInput.value = label;
    basicSearchInput.value = label;
    dropdown.classList.add('hidden');
    activeIndex = -1;
  }

  function highlightItem(index) {
    const items = dropdown.querySelectorAll('li');
    items.forEach(function(li, i) {
      if (i === index) {
        li.classList.add('bg-primary/5', 'text-primary');
      } else {
        li.classList.remove('bg-primary/5', 'text-primary');
      }
    });
  }
  if (basicSearchInput) {
    basicSearchInput.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();

      if (!query) {
        dropdown.classList.add('hidden');
        return;
      }
      const startsWith = CITIES.filter(c => c.label.toLowerCase().startsWith(query));
      const contains   = CITIES.filter(c => !c.label.toLowerCase().startsWith(query) && c.label.toLowerCase().includes(query));
      renderSuggestions([...startsWith, ...contains].slice(0, 8));
    });

    basicSearchInput.addEventListener('keydown', function(e) {
      const items = dropdown.querySelectorAll('li');
      if (!items.length) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        highlightItem(activeIndex);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        highlightItem(activeIndex);
      } else if (e.key === 'Enter' && activeIndex >= 0) {
        e.preventDefault();
        selectCity(CITIES.filter(c => {
          const q = basicSearchInput.value.trim().toLowerCase();
          const sw = CITIES.filter(x => x.label.toLowerCase().startsWith(q));
          const co = CITIES.filter(x => !x.label.toLowerCase().startsWith(q) && x.label.toLowerCase().includes(q));
          return [...sw, ...co];
        })[activeIndex]?.label || items[activeIndex].querySelector('span').textContent);
      } else if (e.key === 'Escape') {
        dropdown.classList.add('hidden');
      }
    });

    basicSearchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && activeIndex >= 0) {
        const highlighted = dropdown.querySelectorAll('li')[activeIndex];
        if (highlighted) {
          e.preventDefault();
          selectCity(highlighted.querySelector('span').textContent);
        }
      }
    });

    basicSearchInput.addEventListener('blur', function() {
      setTimeout(function() {
        dropdown.classList.add('hidden');
      }, 150);
    });

    basicSearchInput.addEventListener('focus', function() {
      if (this.value.trim()) {
        this.dispatchEvent(new Event('input'));
      }
    });
  }

  advSearchInput.addEventListener('input', function() {
    const query = this.value.trim().toLowerCase();

    if (!query) {
      dropdown.classList.add('hidden');
      return;
    }
    const startsWith = CITIES.filter(c => c.label.toLowerCase().startsWith(query));
    const contains   = CITIES.filter(c => !c.label.toLowerCase().startsWith(query) && c.label.toLowerCase().includes(query));
    renderSuggestions([...startsWith, ...contains].slice(0, 8));
  });

  advSearchInput.addEventListener('keydown', function(e) {
    const items = dropdown.querySelectorAll('li');
    if (!items.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      highlightItem(activeIndex);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      highlightItem(activeIndex);
    } else if (e.key === 'Enter' && activeIndex >= 0) {
      e.preventDefault();
      selectCity(CITIES.filter(c => {
        const q = advSearchInput.value.trim().toLowerCase();
        const sw = CITIES.filter(x => x.label.toLowerCase().startsWith(q));
        const co = CITIES.filter(x => !x.label.toLowerCase().startsWith(q) && x.label.toLowerCase().includes(q));
        return [...sw, ...co];
      })[activeIndex]?.label || items[activeIndex].querySelector('span').textContent);
    } else if (e.key === 'Escape') {
      dropdown.classList.add('hidden');
    }
  });

  advSearchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && activeIndex >= 0) {
      const highlighted = dropdown.querySelectorAll('li')[activeIndex];
      if (highlighted) {
        e.preventDefault();
        selectCity(highlighted.querySelector('span').textContent);
      }
    }
  });

  advSearchInput.addEventListener('blur', function() {
    setTimeout(function() {
      dropdown.classList.add('hidden');
    }, 150);
  });

  advSearchInput.addEventListener('focus', function() {
    if (this.value.trim()) {
      this.dispatchEvent(new Event('input'));
    }
  });
</script>
