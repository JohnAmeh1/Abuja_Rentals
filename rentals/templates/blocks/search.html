<div id="overlay"
     class="hidden fixed inset-0 z-1000 bg-black/40"
     style="opacity:0; transition: opacity 250ms ease;" onclick="closeAdvancedModal()"></div>

<div id="advancedModal"
     class="hidden fixed inset-0 z-1001 flex items-center justify-center p-4">
  <div id="modalBox"
       class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"
       style="transform: scale(0.95); opacity: 0; transition: transform 250ms ease, opacity 250ms ease;">

    <div class="flex items-center justify-between p-6 border-b border-gray-100 sticky top-0 bg-white rounded-t-2xl z-20">
      <div>
        <h3 class="text-base font-semibold text-gray-900">Advanced Filters</h3>
        <p class="text-sm text-gray-500">Narrow down your perfect property</p>
      </div>
      <button onclick="closeAdvancedModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition text-gray-500">
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>

    <form method="GET" action="{% url 'properties' %}" id="advancedForm">

      <div class="p-6 space-y-6">

        <div class="grid lg:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-600 mb-2">Location</label>
            <div class="relative" id="autocomplete-wrapper-adv">
              <i class="fas fa-map-marker-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 z-10 pointer-events-none"></i>
              <input
                id="advanced_search"
                name="search"
                type="text"
                value="{{ request.GET.search }}"
                autocomplete="off"
                placeholder="Maitama, Wuse, Gwarinpa..."
                class="text-sm w-full pl-11 pr-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none"
              />
              <!-- FIX: Each input now has its own dedicated dropdown. -->
              <ul id="autocomplete-list-adv"
                  class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg z-200 overflow-hidden max-h-52 overflow-y-auto">
              </ul>
            </div>
          </div>

          <div>
            <label class="block text-sm text-gray-600 mb-2">Property Type</label>
            <div class="relative">
              <i class="fas fa-home absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <select id="modal_property_type" name="property_type"
                      class="text-sm w-full pl-11 pr-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
                <option value="">All Types</option>
                {% for type in property_types %}
                  <option value="{{ type.id }}" {% if request.GET.property_type == type.id|stringformat:"s" %}selected{% endif %}>{{ type.display_name }}</option>
                {% endfor %}
              </select>
              <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            </div>
          </div>
        </div>

        <!-- Purpose -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-3">Listing Purpose</label>
          <div class="flex gap-3">
            <label class="flex-1">
              <input type="radio" name="purpose" value="" class="peer hidden" {% if not request.GET.purpose %}checked{% endif %}>
              <span class="block text-center py-2 px-4 border border-gray-200 rounded-xl text-sm cursor-pointer peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:border-gray-300 transition">Any</span>
            </label>
            <label class="flex-1">
              <input type="radio" name="purpose" value="rent" class="peer hidden" {% if request.GET.purpose == "rent" %}checked{% endif %}>
              <span class="block text-center py-2 px-4 border border-gray-200 rounded-xl text-sm cursor-pointer peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:border-gray-300 transition">For Rent</span>
            </label>
            <label class="flex-1">
              <!-- FIX: Was checking purpose == "rent" instead of "sale". -->
              <input type="radio" name="purpose" value="sale" class="peer hidden" {% if request.GET.purpose == "sale" %}checked{% endif %}>
              <span class="block text-center py-2 px-4 border border-gray-200 rounded-xl text-sm cursor-pointer peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:border-gray-300 transition">For Sale</span>
            </label>
          </div>
        </div>

        <!-- Price -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-3">Price Range (₦)</label>
          <div class="grid grid-cols-2 gap-3">
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">₦</span>
              <input type="text" name="min_price" placeholder="Min" value="{{ request.GET.min_price }}" class="w-full pl-8 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none price-fmt">
            </div>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">₦</span>
              <input type="text" name="max_price" placeholder="Max" value="{{ request.GET.max_price }}" class="w-full pl-8 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none price-fmt">
            </div>
          </div>
        </div>

        <!-- Bedrooms -->
        <div id="adv_rooms_section" class="grid lg:grid-cols-2 gap-4">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-3">Bedrooms</label>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <p class="text-xs text-gray-400 mb-1.5">Minimum</p>
                <div class="relative">
                  <i class="fas fa-bed absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                  <select name="min_bedrooms" class="w-full pl-8 pr-8 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
                    <option value="">Any</option>
                    {% for i in "123456789" %}<option value="{{ i }}" {% if request.GET.min_bedrooms == i %}selected{% endif %}>{{ i }}</option>{% endfor %}
                    <option value="10" {% if request.GET.min_bedrooms == "10" %}selected{% endif %}>10</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                </div>
              </div>
              <div>
                <p class="text-xs text-gray-400 mb-1.5">Maximum</p>
                <div class="relative">
                  <i class="fas fa-bed absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                  <select name="max_bedrooms" class="w-full pl-8 pr-8 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
                    <option value="">Any</option>
                    {% for i in "123456789" %}<option value="{{ i }}" {% if request.GET.max_bedrooms == i %}selected{% endif %}>{{ i }}</option>{% endfor %}
                    <option value="10" {% if request.GET.max_bedrooms == "10" %}selected{% endif %}>10+</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Bathrooms -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">Bathrooms</label>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <p class="text-xs text-gray-400 mb-1.5">Minimum</p>
                <div class="relative">
                  <i class="fas fa-bath absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                  <select name="min_bathrooms" class="w-full pl-8 pr-8 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
                    <option value="">Any</option>
                    {% for i in "123456789" %}<option value="{{ i }}" {% if request.GET.min_bathrooms == i %}selected{% endif %}>{{ i }}</option>{% endfor %}
                    <option value="10" {% if request.GET.min_bathrooms == "10" %}selected{% endif %}>10</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                </div>
              </div>
              <div>
                <p class="text-xs text-gray-400 mb-1.5">Maximum</p>
                <div class="relative">
                  <i class="fas fa-bath absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                  <select name="max_bathrooms" class="w-full pl-8 pr-8 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
                    <option value="">Any</option>
                    {% for i in "123456789" %}<option value="{{ i }}" {% if request.GET.max_bathrooms == i %}selected{% endif %}>{{ i }}</option>{% endfor %}
                    <option value="10" {% if request.GET.max_bathrooms == "10" %}selected{% endif %}>10+</option>
                  </select>
                  <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="schoolSection">
          <label class="block text-sm font-medium text-gray-700 mb-1">Near a School?</label>
          <p class="text-xs text-gray-400 mb-3">Filter properties listed near a specific institution</p>
          <div class="relative">
            <i class="fas fa-graduation-cap absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <select name="school" class="w-full pl-11 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none">
              <option value="">Any / Not Student Housing</option>
              {% for school in schools %}
                <option value="{{ school.id }}" {% if request.GET.school == school.id|stringformat:"s" %}selected{% endif %}>{{ school.name }} ({{ school.short_name }})</option>
              {% endfor %}
            </select>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-3">Property Features</label>
          <div class="grid grid-cols-3 gap-3">
            <label class="flex items-center gap-2 p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-gray-300 has-checked:border-primary has-checked:bg-primary/5 transition">
              <input type="checkbox" name="furnished" value="true" class="accent-primary" {% if request.GET.furnished == "true" %}checked{% endif %}>
              <span class="text-sm text-gray-700">Furnished</span>
            </label>
            <label class="flex items-center gap-2 p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-gray-300 has-checked:border-primary has-checked:bg-primary/5 transition">
              <input type="checkbox" name="serviced" value="true" class="accent-primary" {% if request.GET.serviced == "true" %}checked{% endif %}>
              <span class="text-sm text-gray-700">Serviced</span>
            </label>
            <label class="flex items-center gap-2 p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-gray-300 has-checked:border-primary has-checked:bg-primary/5 transition">
              <input type="checkbox" name="shared" value="true" class="accent-primary" {% if request.GET.shared == "true" %}checked{% endif %}>
              <span class="text-sm text-gray-700">Shared</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-3">Amenities</label>
          <div class="flex flex-wrap gap-2">
            {% for amenity in amenity_choices %}
              <label>
                <input type="checkbox" name="amenities" value="{{ amenity.id }}" class="hidden peer"
                       {% if amenity.id in active.amenities %}checked{% endif %}>
                <span class="block px-3 py-1 border border-gray-200 rounded-md text-[11px] cursor-pointer
                             peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary
                             hover:border-gray-300 transition">
                  {% if amenity.icon %}<i class="{{ amenity.icon }}"></i> {% endif %}{{ amenity.display_name }}
                </span>
              </label>
            {% endfor %}
          </div>
        </div>

      </div>

      <div class="flex gap-3 p-6 border-t border-gray-100 sticky bottom-0 bg-white rounded-b-2xl">
        <button type="button" onclick="clearAdvancedForm()" class="flex-1 py-2.5 border border-gray-200 text-gray-600 text-sm rounded-xl hover:bg-gray-50 transition">
          Clear All
        </button>
        <button type="submit" class="flex-1 py-2.5 bg-primary text-white text-sm rounded-xl hover:bg-primary/90 transition flex items-center justify-center gap-2">
          <i class="fas fa-search"></i>
          Show Results
        </button>
      </div>
    </form>
  </div>
</div>


<script>
  document.getElementById('modal_property_type').addEventListener('change', function () {
    const label = this.options[this.selectedIndex].text.toLowerCase();
    const section = document.getElementById('adv_rooms_section');
    const schoolSection = document.getElementById('schoolSection');
    const isRes = !this.value || RESIDENTIAL_TYPES.some(r => label.includes(r));
    section.style.display = isRes ? '' : 'none';
    schoolSection.style.display = isRes ? '' : 'none';
    if (!isRes) {
      section.querySelectorAll('select').forEach(s => s.value = '');
      schoolSection.querySelectorAll('select').forEach(s => s.value = '');
    }
  });

  document.getElementById('modal_property_type').dispatchEvent(new Event('change'));

  let overlay = document.getElementById('overlay');
  let advmodal = document.getElementById('advancedModal');
  const box    = document.getElementById('modalBox');

  function openAdvancedModal(from) {
    if (from === "search") {
      document.getElementById('advanced_search').value = document.getElementById('basic_search').value;
      document.getElementById('modal_property_type').value = document.getElementById('basic_property_type').value;
      // Re-evaluate rooms visibility after syncing the type.
      document.getElementById('modal_property_type').dispatchEvent(new Event('change'));
    }

    overlay.classList.remove('hidden');
    advmodal.classList.remove('hidden');

    void overlay.offsetHeight;

    overlay.style.opacity = '1';
    box.style.opacity = '1';
    box.style.transform = 'scale(1)';

    document.body.style.overflow = 'hidden';
  }

  function closeAdvancedModal() {
    overlay.style.opacity = '0';
    box.style.transform = 'scale(0.95)';
    box.style.opacity = '0';

    overlay.addEventListener('transitionend', function handler() {
      overlay.classList.add('hidden');
      advmodal.classList.add('hidden');
      overlay.removeEventListener('transitionend', handler);
    });

    document.body.style.overflow = '';
  }

  function clearAdvancedForm() {
    document.getElementById('advancedForm').reset();
    // Re-evaluate after clear (type is now blank = residential assumed).
    document.getElementById('modal_property_type').dispatchEvent(new Event('change'));
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAdvancedModal();
  });
</script>

<script>

  let CITIES = [
    {% for city in cities %}
      { code: "{{ city.id }}", label: "{{ city.name }}" },
    {% endfor %}
  ];

  function makeAutocomplete({ inputEl, dropdownEl, mirrorEl }) {
    let activeIndex = -1;

    function getFiltered(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const sw = CITIES.filter(c => c.label.toLowerCase().startsWith(q));
      const co = CITIES.filter(c => !c.label.toLowerCase().startsWith(q) && c.label.toLowerCase().includes(q));
      return [...sw, ...co].slice(0, 8);
    }

    function renderSuggestions(matches) {
      dropdownEl.innerHTML = '';
      activeIndex = -1;

      if (!matches.length) {
        dropdownEl.classList.add('hidden');
        return;
      }

      matches.forEach(function(city) {
        const li = document.createElement('li');
        li.className = 'flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 cursor-pointer hover:bg-gray-50 transition-colors';
        li.innerHTML =
          '<i class="fas fa-map-marker-alt text-gray-300 text-xs w-3"></i>' +
        '<span>' + city.label + '</span>';

        li.addEventListener('mousedown', function(e) {
          e.preventDefault();
          selectCity(city.label);
        });

        dropdownEl.appendChild(li);
      });

      dropdownEl.classList.remove('hidden');
    }

    function highlightItem(index) {
      dropdownEl.querySelectorAll('li').forEach(function(li, i) {
        li.classList.toggle('bg-primary/5', i === index);
        li.classList.toggle('text-primary', i === index);
      });
    }

    function selectCity(label) {
      inputEl.value = label;
      if (mirrorEl) mirrorEl.value = label;
      dropdownEl.classList.add('hidden');
      activeIndex = -1;
    }

    inputEl.addEventListener('input', function() {
      renderSuggestions(getFiltered(this.value));
    });

    // FIX: Was registered twice — now only once per input.
    inputEl.addEventListener('keydown', function(e) {
      const items = dropdownEl.querySelectorAll('li');
      if (!items.length) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        highlightItem(activeIndex);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        highlightItem(activeIndex);
      } else if (e.key === 'Enter' && activeIndex >= 0) {
        e.preventDefault();
        const highlighted = items[activeIndex];
        if (highlighted) selectCity(highlighted.querySelector('span').textContent);
      } else if (e.key === 'Escape') {
        dropdownEl.classList.add('hidden');
      }
    });

    inputEl.addEventListener('blur', function() {
      setTimeout(function() { dropdownEl.classList.add('hidden'); }, 150);
    });

    inputEl.addEventListener('focus', function() {
      if (this.value.trim()) this.dispatchEvent(new Event('input'));
    });
  }

  // Wire up the basic search (in sidebar filter form).
  const basicSearchEl = document.getElementById('basic_search');
  const basicDropdown = document.getElementById('autocomplete-list');
  if (basicSearchEl && basicDropdown) {
    makeAutocomplete({
      inputEl:    basicSearchEl,
      dropdownEl: basicDropdown,
      mirrorEl:   document.getElementById('advanced_search'),
    });
  }

  // Wire up the advanced modal search (has its own dropdown).
  const advSearchEl  = document.getElementById('advanced_search');
  const advDropdown  = document.getElementById('autocomplete-list-adv');
  if (advSearchEl && advDropdown) {
    makeAutocomplete({
      inputEl:    advSearchEl,
      dropdownEl: advDropdown,
      mirrorEl:   basicSearchEl,
    });
  }
</script>
